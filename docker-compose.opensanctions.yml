version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: opensanctions_postgres
    environment:
      POSTGRES_DB: opensanctions
      POSTGRES_USER: opensanctions
      POSTGRES_PASSWORD: opensanctions_dev
    ports:
      - "5432:5432"
    volumes:
      - opensanctions_postgres_data:/var/lib/postgresql/data
      - ./scripts/setupOpenSanctionsDB.sql:/docker-entrypoint-initdb.d/01-setup.sql
    command: >
      postgres
      -c shared_buffers=1GB
      -c work_mem=32MB
      -c maintenance_work_mem=256MB
      -c effective_cache_size=3GB
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opensanctions"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: opensanctions_redis
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - opensanctions_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: opensanctions_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@opensanctions.local
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    depends_on:
      - postgres
    volumes:
      - opensanctions_pgadmin_data:/var/lib/pgadmin

volumes:
  opensanctions_postgres_data:
  opensanctions_redis_data:
  opensanctions_pgadmin_data: