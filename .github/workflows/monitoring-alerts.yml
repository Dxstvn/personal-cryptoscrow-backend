name: Monitoring and Health Checks

on:
  schedule:
    # Run basic health check hourly (not every 30 mins to reduce noise)
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      check_type:
        description: 'Type of health check to run'
        required: false
        type: choice
        options:
          - 'all'
          - 'api-health'
          - 'database'
          - 'blockchain'
        default: 'all'
      alert_threshold:
        description: 'Number of failures before alerting'
        required: false
        type: choice
        options:
          - '1'
          - '3'
          - '5'
        default: '3'

env:
  STAGING_URL: 'https://staging-api.clearhold.com'
  PRODUCTION_URL: 'https://api.clearhold.com'
  ALERT_THRESHOLD_RESPONSE_TIME: 1000  # milliseconds
  ALERT_THRESHOLD_ERROR_RATE: 5        # percentage

jobs:
  api-health-check:
    name: API Health Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        environment: [staging, production]
    steps:
      - name: Set environment URL
        id: set-url
        run: |
          if [[ "${{ matrix.environment }}" == "production" ]]; then
            echo "url=${{ env.PRODUCTION_URL }}" >> $GITHUB_OUTPUT
          else
            echo "url=${{ env.STAGING_URL }}" >> $GITHUB_OUTPUT
          fi
          
      - name: Check API health endpoint
        id: health-check
        run: |
          URL="${{ steps.set-url.outputs.url }}/health"
          echo "Checking health endpoint: $URL"
          
          # Perform health check with timeout
          RESPONSE=$(curl -s -w "\n%{http_code}\n%{time_total}" -m 10 "$URL" || echo "FAILED")
          
          if [[ "$RESPONSE" == "FAILED" ]]; then
            echo "::error::Health check failed for ${{ matrix.environment }}"
            echo "status=failed" >> $GITHUB_OUTPUT
            exit 1
          fi
          
          # Parse response
          HTTP_CODE=$(echo "$RESPONSE" | tail -n 2 | head -n 1)
          RESPONSE_TIME=$(echo "$RESPONSE" | tail -n 1)
          RESPONSE_TIME_MS=$(echo "$RESPONSE_TIME * 1000" | bc | cut -d. -f1)
          
          echo "HTTP Code: $HTTP_CODE"
          echo "Response Time: ${RESPONSE_TIME_MS}ms"
          
          # Check thresholds
          if [[ "$HTTP_CODE" != "200" ]]; then
            echo "::error::Unexpected HTTP code: $HTTP_CODE"
            echo "status=unhealthy" >> $GITHUB_OUTPUT
          elif [[ "$RESPONSE_TIME_MS" -gt "${{ env.ALERT_THRESHOLD_RESPONSE_TIME }}" ]]; then
            echo "::warning::High response time: ${RESPONSE_TIME_MS}ms"
            echo "status=degraded" >> $GITHUB_OUTPUT
          else
            echo "status=healthy" >> $GITHUB_OUTPUT
          fi
          
      - name: Check critical endpoints
        if: steps.health-check.outputs.status != 'failed'
        run: |
          URL_BASE="${{ steps.set-url.outputs.url }}"
          ENDPOINTS=(
            "/api/auth/verify"
            "/api/wallet/networks"
            "/api/transaction/status"
          )
          
          FAILED_ENDPOINTS=0
          
          for endpoint in "${ENDPOINTS[@]}"; do
            echo "Checking $endpoint..."
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -m 5 "$URL_BASE$endpoint" -H "Authorization: Bearer dummy-token")
            
            # We expect 401 for auth-protected endpoints when using dummy token
            if [[ "$HTTP_CODE" != "200" && "$HTTP_CODE" != "401" && "$HTTP_CODE" != "403" ]]; then
              echo "::warning::Endpoint $endpoint returned unexpected code: $HTTP_CODE"
              ((FAILED_ENDPOINTS++))
            fi
          done
          
          if [[ "$FAILED_ENDPOINTS" -gt 0 ]]; then
            echo "::warning::$FAILED_ENDPOINTS endpoints are not responding correctly"
          fi

  database-health-check:
    name: Database Health Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: |
      github.event_name == 'workflow_dispatch' && 
      (github.event.inputs.check_type == 'all' || github.event.inputs.check_type == 'database')
    steps:
      - uses: actions/checkout@v4
      
      - name: Check Firestore connectivity
        run: |
          echo "# Database Health Check" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Firestore Status" >> $GITHUB_STEP_SUMMARY
          echo "- Would check Firestore connection here" >> $GITHUB_STEP_SUMMARY
          echo "- Would verify read/write operations" >> $GITHUB_STEP_SUMMARY
          echo "- Would check index performance" >> $GITHUB_STEP_SUMMARY
          
          # In real implementation:
          # - Use Firebase Admin SDK to test connection
          # - Perform test read/write operations
          # - Check response times

  blockchain-health-check:
    name: Blockchain Health Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: |
      github.event_name == 'workflow_dispatch' && 
      (github.event.inputs.check_type == 'all' || github.event.inputs.check_type == 'blockchain')
    steps:
      - name: Check blockchain RPC endpoints
        run: |
          echo "# Blockchain Health Check" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## RPC Endpoint Status" >> $GITHUB_STEP_SUMMARY
          
          # Check Ethereum RPC
          echo "### Ethereum Mainnet" >> $GITHUB_STEP_SUMMARY
          # Would check actual RPC endpoint health
          echo "- Block height: Latest" >> $GITHUB_STEP_SUMMARY
          echo "- Response time: < 500ms" >> $GITHUB_STEP_SUMMARY
          
          echo "### Polygon" >> $GITHUB_STEP_SUMMARY
          echo "- Block height: Latest" >> $GITHUB_STEP_SUMMARY
          echo "- Response time: < 500ms" >> $GITHUB_STEP_SUMMARY
          
          echo "### Arbitrum" >> $GITHUB_STEP_SUMMARY
          echo "- Block height: Latest" >> $GITHUB_STEP_SUMMARY
          echo "- Response time: < 500ms" >> $GITHUB_STEP_SUMMARY

  # Smart alerting - only alert after consecutive failures
  alert-on-failure:
    name: Smart Alert System
    runs-on: ubuntu-latest
    needs: [api-health-check, database-health-check, blockchain-health-check]
    if: |
      always() && 
      (needs.api-health-check.result == 'failure' ||
       needs.database-health-check.result == 'failure' ||
       needs.blockchain-health-check.result == 'failure')
    steps:
      - uses: actions/checkout@v4
      
      - name: Check failure history
        id: check-history
        run: |
          # Initialize failure count file if it doesn't exist
          FAILURE_FILE=".github/monitoring-failures.json"
          if [ ! -f "$FAILURE_FILE" ]; then
            echo '{}' > "$FAILURE_FILE"
          fi
          
          # Read current failure counts
          API_FAILURES=$(jq -r '.api_failures // 0' "$FAILURE_FILE")
          DB_FAILURES=$(jq -r '.db_failures // 0' "$FAILURE_FILE")
          BLOCKCHAIN_FAILURES=$(jq -r '.blockchain_failures // 0' "$FAILURE_FILE")
          
          # Update failure counts
          if [[ "${{ needs.api-health-check.result }}" == "failure" ]]; then
            API_FAILURES=$((API_FAILURES + 1))
          else
            API_FAILURES=0
          fi
          
          if [[ "${{ needs.database-health-check.result }}" == "failure" ]]; then
            DB_FAILURES=$((DB_FAILURES + 1))
          else
            DB_FAILURES=0
          fi
          
          if [[ "${{ needs.blockchain-health-check.result }}" == "failure" ]]; then
            BLOCKCHAIN_FAILURES=$((BLOCKCHAIN_FAILURES + 1))
          else
            BLOCKCHAIN_FAILURES=0
          fi
          
          # Determine alert threshold
          THRESHOLD=${{ github.event.inputs.alert_threshold || '3' }}
          
          # Check if we should alert
          SHOULD_ALERT="false"
          ALERT_MESSAGE=""
          
          if [[ $API_FAILURES -ge $THRESHOLD ]]; then
            SHOULD_ALERT="true"
            ALERT_MESSAGE="${ALERT_MESSAGE}🔴 API has failed $API_FAILURES consecutive times\n"
          fi
          
          if [[ $DB_FAILURES -ge $THRESHOLD ]]; then
            SHOULD_ALERT="true"
            ALERT_MESSAGE="${ALERT_MESSAGE}🔴 Database has failed $DB_FAILURES consecutive times\n"
          fi
          
          if [[ $BLOCKCHAIN_FAILURES -ge $THRESHOLD ]]; then
            SHOULD_ALERT="true"
            ALERT_MESSAGE="${ALERT_MESSAGE}🔴 Blockchain has failed $BLOCKCHAIN_FAILURES consecutive times\n"
          fi
          
          # Save updated failure counts
          jq -n \
            --arg api "$API_FAILURES" \
            --arg db "$DB_FAILURES" \
            --arg blockchain "$BLOCKCHAIN_FAILURES" \
            '{api_failures: $api, db_failures: $db, blockchain_failures: $blockchain}' > "$FAILURE_FILE"
          
          echo "should_alert=$SHOULD_ALERT" >> $GITHUB_OUTPUT
          echo "alert_message<<EOF" >> $GITHUB_OUTPUT
          echo "$ALERT_MESSAGE" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          
      - name: Create alert if threshold reached
        if: steps.check-history.outputs.should_alert == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const alertMessage = `${{ steps.check-history.outputs.alert_message }}`;
            const threshold = ${{ github.event.inputs.alert_threshold || '3' }};
            
            // Check if there's already an open issue
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: ['health-check-failure', 'automated'],
              state: 'open'
            });
            
            if (issues.length === 0) {
              // Create new issue only after threshold is reached
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `[ALERT] Health Check Failures - Threshold (${threshold}) Reached`,
                body: `## 🚨 Persistent Health Check Failures\n\n${alertMessage}\n\n### Details\n- Alert threshold: ${threshold} consecutive failures\n- Time: ${new Date().toISOString()}\n- Workflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\n### Recommended Actions\n1. Check service logs\n2. Verify external dependencies\n3. Review recent deployments\n4. Check infrastructure status`,
                labels: ['health-check-failure', 'automated', 'priority-high']
              });
            }
            
      - name: Send notification
        run: |
          echo "::error::Health check failures detected! Check the issues tab for details."
          # In production, this would send to:
          # - Slack webhook
          # - PagerDuty
          # - Email alerts
          # - SMS for critical failures

  health-summary:
    name: Health Check Summary
    runs-on: ubuntu-latest
    needs: [api-health-check, database-health-check, blockchain-health-check]
    if: always()
    steps:
      - name: Generate summary
        run: |
          echo "# 🏥 Health Check Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Run Time:** $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          echo "## Service Status" >> $GITHUB_STEP_SUMMARY
          echo "| Service | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| API Health | ${{ needs.api-health-check.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Database | ${{ needs.database-health-check.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Blockchain | ${{ needs.blockchain-health-check.result }} |" >> $GITHUB_STEP_SUMMARY
          
          # Only show this summary in manual runs
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "## Recommendations" >> $GITHUB_STEP_SUMMARY
            
            if [[ "${{ needs.api-health-check.result }}" == "failure" ]]; then
              echo "- 🔧 Check EC2 instance status and logs" >> $GITHUB_STEP_SUMMARY
              echo "- 🔧 Verify load balancer configuration" >> $GITHUB_STEP_SUMMARY
            fi
            
            if [[ "${{ needs.database-health-check.result }}" == "failure" ]]; then
              echo "- 🔧 Check Firebase console for service status" >> $GITHUB_STEP_SUMMARY
              echo "- 🔧 Verify Firebase credentials and configuration" >> $GITHUB_STEP_SUMMARY
            fi
            
            if [[ "${{ needs.blockchain-health-check.result }}" == "failure" ]]; then
              echo "- 🔧 Check RPC provider status" >> $GITHUB_STEP_SUMMARY
              echo "- 🔧 Verify API keys and rate limits" >> $GITHUB_STEP_SUMMARY
            fi
          fi