name: Backend Agent Coordination System

on:
  push:
    branches: [main, develop, staging]
  pull_request:
    types: [opened, synchronize, closed, ready_for_review]
  workflow_dispatch:
    inputs:
      agent_task:
        description: 'Specific backend task'
        required: false
        type: choice
        options:
          - 'API endpoint review'
          - 'Database optimization'
          - 'Smart contract integration'
          - 'Performance tuning'
          - 'Security hardening'
      deployment_target:
        description: 'Deployment environment'
        required: false
        type: choice
        options:
          - 'none'
          - 'staging'
          - 'production'
  issues:
    types: [opened, labeled]
  repository_dispatch:
    types: [frontend-integration-request]

env:
  AWS_REGION: 'us-east-1'
  FIREBASE_PROJECT: 'ethescrow-377c6'
  NODE_VERSION: '18.x'

jobs:
  detect-backend-changes:
    runs-on: ubuntu-latest
    outputs:
      api_changed: ${{ steps.changes.outputs.api }}
      blockchain_changed: ${{ steps.changes.outputs.blockchain }}
      database_changed: ${{ steps.changes.outputs.database }}
      security_impact: ${{ steps.changes.outputs.security }}
      deployment_needed: ${{ steps.changes.outputs.deployment }}
      affected_endpoints: ${{ steps.analyze.outputs.endpoints }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: Detect file changes
        uses: dorny/paths-filter@v2
        id: changes
        with:
          filters: |
            api:
              - 'src/api/routes/**'
              - 'src/api/middleware/**'
              - 'src/server.js'
            blockchain:
              - 'src/contract/**'
              - 'src/services/escrowServiceV3.js'
              - 'src/services/contractConditionSync.js'
              - 'hardhat.config.js'
            database:
              - 'src/services/databaseService.js'
              - 'firestore.rules'
              - 'firestore.indexes.json'
            security:
              - 'src/api/middleware/securityMiddleware.js'
              - 'src/config/awsSecretsManager.js'
              - '**/*.env*'
              - 'firebase.json'
            deployment:
              - 'aws-deployment/**'
              - 'scripts/deploy*.sh'
              - 'package.json'
              
      - name: Analyze API endpoints
        id: analyze
        run: |
          # Extract modified API endpoints
          ENDPOINTS=$(git diff --name-only HEAD~1 HEAD | grep "src/api/routes" | sed 's/src\/api\/routes\///' | sed 's/\.js$//' | jq -R . | jq -s . -c)
          echo "endpoints=$ENDPOINTS" >> $GITHUB_OUTPUT

  backend-engineer-tasks:
    needs: detect-backend-changes
    if: |
      needs.detect-backend-changes.outputs.api_changed == 'true' ||
      needs.detect-backend-changes.outputs.blockchain_changed == 'true' ||
      github.event.inputs.agent_task != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Generate Backend Task Report
        run: |
          cat > backend-analysis.md << 'EOF'
          # Backend Engineer Analysis Report
          
          ## Change Summary
          - API Routes: ${{ needs.detect-backend-changes.outputs.api_changed }}
          - Blockchain: ${{ needs.detect-backend-changes.outputs.blockchain_changed }}
          - Database: ${{ needs.detect-backend-changes.outputs.database_changed }}
          
          ## API Endpoint Analysis
          Modified endpoints: ${{ needs.detect-backend-changes.outputs.affected_endpoints }}
          
          ## Required Validations
          1. Request/Response contract consistency
          2. Error handling completeness
          3. Authentication middleware
          4. Rate limiting configuration
          5. Input validation & sanitization
          
          ## Database Considerations
          - Index optimization
          - Query performance
          - Real-time sync impact
          - Backup strategy
          
          ## Blockchain Integration
          - Gas estimation accuracy
          - Multi-chain compatibility
          - Event listener reliability
          - Transaction retry logic
          EOF
          
          cat backend-analysis.md >> $GITHUB_STEP_SUMMARY
          
      - name: Create Backend Task Issue
        uses: actions/github-script@v7
        with:
          script: |
            const endpoints = JSON.parse('${{ needs.detect-backend-changes.outputs.affected_endpoints }}' || '[]');
            const taskBody = `
            ## 🔧 Backend Engineer Task
            
            **Triggered by**: ${context.eventName}
            **Task Type**: ${context.payload.inputs?.agent_task || 'Code change review'}
            
            ### Modified Components
            - API Endpoints: ${endpoints.join(', ') || 'None'}
            - Blockchain Integration: ${{ needs.detect-backend-changes.outputs.blockchain_changed }}
            - Database Layer: ${{ needs.detect-backend-changes.outputs.database_changed }}
            
            ### Action Items
            
            #### 1. API Validation
            - [ ] Verify all endpoints follow RESTful conventions
            - [ ] Ensure consistent error response format
            - [ ] Validate request schemas with Joi/Zod
            - [ ] Check rate limiting on sensitive endpoints
            - [ ] Update API documentation
            
            #### 2. Database Optimization
            - [ ] Review Firestore query efficiency
            - [ ] Check composite index usage
            - [ ] Validate real-time listener performance
            - [ ] Ensure proper data validation rules
            
            #### 3. Blockchain Integration
            - [ ] Verify gas estimation logic
            - [ ] Test multi-chain transaction flow
            - [ ] Validate event listener reliability
            - [ ] Check smart contract ABI updates
            
            #### 4. Testing Requirements
            - [ ] Unit tests for new functions
            - [ ] Integration tests with Firebase emulators
            - [ ] E2E tests for critical flows
            - [ ] Load testing for API endpoints
            
            #### 5. Frontend Impact Assessment
            ${endpoints.length > 0 ? `
            The following endpoints have changed and may require frontend updates:
            ${endpoints.map(e => `- /api/${e}`).join('\n')}
            
            Please create a cross-repository issue for frontend team.
            ` : 'No API changes affecting frontend detected.'}
            
            ### Performance Benchmarks
            - API Response Time: < 200ms
            - Database Query Time: < 100ms
            - Transaction Processing: < 5s
            
            /cc @cryptoescrow-backend-engineer
            `;
            
            const issue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[BACKEND-AGENT] Review ${endpoints.length} API changes`,
              body: taskBody,
              labels: ['agent-task', 'backend', 'priority-high']
            });
            
            core.setOutput('issue_number', issue.data.number);

  blockchain-security-check:
    needs: detect-backend-changes
    if: needs.detect-backend-changes.outputs.blockchain_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          
      - name: Smart Contract Analysis
        run: |
          echo "## 🔗 Blockchain Security Analysis" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Check for common vulnerabilities
          echo "### Vulnerability Scan" >> $GITHUB_STEP_SUMMARY
          
          # Look for reentrancy patterns
          if grep -r "call.value\|\.call{value:" src/contract/contracts/; then
            echo "⚠️ External calls detected - verify reentrancy protection" >> $GITHUB_STEP_SUMMARY
          fi
          
          # Check for integer overflow
          if grep -r "SafeMath" src/contract/contracts/; then
            echo "✅ SafeMath usage detected" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ Consider using SafeMath for arithmetic operations" >> $GITHUB_STEP_SUMMARY
          fi
          
      - name: Create Security Alert
        uses: actions/github-script@v7
        with:
          script: |
            const securityIssue = `
            ## 🔒 Smart Contract Security Review Required
            
            **Severity**: HIGH
            **Component**: Blockchain Integration
            
            ### Security Checklist
            - [ ] Reentrancy protection verified
            - [ ] Integer overflow/underflow checks
            - [ ] Access control modifiers correct
            - [ ] Emergency pause mechanism tested
            - [ ] Event emission comprehensive
            - [ ] Gas optimization review
            - [ ] Upgrade mechanism secure
            
            ### Required Tests
            1. Unit tests for all contract functions
            2. Integration tests with mainnet forks
            3. Gas consumption benchmarks
            4. Failure scenario testing
            
            ### Cross-Chain Considerations
            - [ ] LayerZero integration security
            - [ ] Bridge transaction validation
            - [ ] Multi-sig wallet controls
            
            /cc @clearhold-security-auditor
            `;
            
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '[SECURITY-AGENT] Smart contract changes require audit',
              body: securityIssue,
              labels: ['agent-task', 'security', 'blockchain', 'priority-critical']
            });

  api-testing-suite:
    needs: detect-backend-changes
    if: |
      needs.detect-backend-changes.outputs.api_changed == 'true' ||
      github.event.inputs.agent_task == 'API endpoint review'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Test Environment
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          
      - name: Generate API Test Plan
        run: |
          cat > api-test-plan.md << 'EOF'
          # API Testing Plan
          
          ## Test Categories
          
          ### 1. Authentication Tests
          - JWT token generation
          - Token refresh flow
          - Invalid token handling
          - Rate limiting on auth endpoints
          
          ### 2. CRUD Operations
          - Create operations with validation
          - Read operations with pagination
          - Update operations with conflicts
          - Delete operations with cascading
          
          ### 3. Integration Tests
          - Firebase Auth integration
          - Firestore transaction handling
          - Storage service integration
          - Blockchain service calls
          
          ### 4. Performance Tests
          - Concurrent request handling
          - Database connection pooling
          - Response time benchmarks
          - Memory usage monitoring
          
          ### 5. Security Tests
          - SQL injection attempts
          - XSS payload testing
          - Authentication bypass attempts
          - Rate limiting effectiveness
          EOF
          
          cat api-test-plan.md >> $GITHUB_STEP_SUMMARY
          
      - name: Create Testing Task
        uses: actions/github-script@v7
        with:
          script: |
            const endpoints = JSON.parse('${{ needs.detect-backend-changes.outputs.affected_endpoints }}' || '[]');
            const testTask = `
            ## 🧪 Backend API Testing Required
            
            ### Test Execution Plan
            
            #### Unit Tests
            \`\`\`bash
            npm test -- src/api/routes/${endpoints.join(' src/api/routes/')}
            \`\`\`
            
            #### Integration Tests
            \`\`\`bash
            firebase emulators:start --only firestore,auth,storage
            npm run test:integration
            \`\`\`
            
            #### Load Testing
            \`\`\`bash
            npm run test:load -- --target ${endpoints.map(e => `/api/${e}`).join(',')}
            \`\`\`
            
            ### Coverage Requirements
            - Unit Tests: ≥ 85%
            - Integration Tests: ≥ 75%
            - E2E Tests: Critical paths 100%
            
            ### Performance Benchmarks
            - p50 latency: < 100ms
            - p95 latency: < 500ms
            - p99 latency: < 1000ms
            - Error rate: < 0.1%
            
            /cc @clearhold-testing-expert
            `;
            
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '[TEST-AGENT] API testing suite execution',
              body: testTask,
              labels: ['agent-task', 'testing', 'api']
            });

  database-optimization:
    needs: detect-backend-changes
    if: needs.detect-backend-changes.outputs.database_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Analyze Database Changes
        run: |
          echo "## 📊 Database Optimization Analysis" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Check Firestore indexes
          if [ -f "firestore.indexes.json" ]; then
            echo "### Firestore Indexes" >> $GITHUB_STEP_SUMMARY
            echo '```json' >> $GITHUB_STEP_SUMMARY
            cat firestore.indexes.json | jq '.indexes | length' >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
          
          # Check security rules
          if [ -f "firestore.rules" ]; then
            echo "### Security Rules Analysis" >> $GITHUB_STEP_SUMMARY
            echo "- Rules file size: $(wc -l < firestore.rules) lines" >> $GITHUB_STEP_SUMMARY
          fi
          
      - name: Create Database Task
        uses: actions/github-script@v7
        with:
          script: |
            const dbTask = `
            ## 🗄️ Database Optimization Required
            
            ### Analysis Points
            
            1. **Query Performance**
               - Review composite indexes
               - Optimize collection structures
               - Implement query caching
               
            2. **Real-time Sync**
               - Minimize listener scope
               - Implement debouncing
               - Use snapshot diffs efficiently
               
            3. **Data Modeling**
               - Denormalization strategies
               - Document size optimization
               - Subcollection vs array trade-offs
               
            4. **Security Rules**
               - Validate rule efficiency
               - Test rule coverage
               - Audit access patterns
               
            ### Performance Metrics
            - Query response: < 100ms
            - Write latency: < 200ms
            - Listener setup: < 50ms
            
            /cc @cryptoescrow-backend-engineer
            `;
            
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '[BACKEND-AGENT] Database optimization needed',
              body: dbTask,
              labels: ['agent-task', 'backend', 'database', 'performance']
            });

  deployment-preparation:
    needs: detect-backend-changes
    if: |
      needs.detect-backend-changes.outputs.deployment_needed == 'true' ||
      github.event.inputs.deployment_target != 'none'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Deployment Checklist
        run: |
          cat > deployment-checklist.md << 'EOF'
          # Deployment Preparation Checklist
          
          ## Pre-deployment Validation
          - [ ] All tests passing
          - [ ] Security scan completed
          - [ ] Performance benchmarks met
          - [ ] API documentation updated
          - [ ] Environment variables configured
          - [ ] AWS secrets updated
          - [ ] Database migrations prepared
          
          ## Deployment Steps
          1. Backup current deployment
          2. Update AWS Secrets Manager
          3. Deploy to EC2 instance
          4. Run smoke tests
          5. Monitor error rates
          6. Update load balancer
          
          ## Rollback Plan
          - Previous version tagged
          - Database backup available
          - Rollback script tested
          - Monitoring alerts configured
          EOF
          
          cat deployment-checklist.md >> $GITHUB_STEP_SUMMARY

  cross-repository-sync:
    needs: [detect-backend-changes, backend-engineer-tasks]
    if: |
      needs.detect-backend-changes.outputs.api_changed == 'true' &&
      needs.backend-engineer-tasks.outputs.issue_number != ''
    runs-on: ubuntu-latest
    steps:
      - name: Notify Frontend Repository
        uses: actions/github-script@v7
        with:
          script: |
            // Create a repository dispatch event for frontend repo
            const endpoints = JSON.parse('${{ needs.detect-backend-changes.outputs.affected_endpoints }}' || '[]');
            
            const notification = {
              event_type: 'backend-api-changes',
              client_payload: {
                backend_issue: '${{ needs.backend-engineer-tasks.outputs.issue_number }}',
                changed_endpoints: endpoints,
                commit_sha: context.sha,
                timestamp: new Date().toISOString()
              }
            };
            
            // Log the notification (in real scenario, would dispatch to frontend repo)
            console.log('Cross-repository notification:', notification);
            
            // Create tracking issue
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '[FRONTEND-SYNC] API changes require frontend updates',
              body: `
              ## Frontend Synchronization Required
              
              Backend API changes have been detected that require frontend updates.
              
              ### Changed Endpoints
              ${endpoints.map(e => `- \`/api/${e}\``).join('\n')}
              
              ### Backend Issue
              See #${{ needs.backend-engineer-tasks.outputs.issue_number }} for details
              
              ### Action Required
              The frontend team should:
              1. Update API client calls
              2. Adjust TypeScript interfaces
              3. Update error handling
              4. Test integration thoroughly
              
              /cc @clearhold-frontend-engineer
              `,
              labels: ['cross-repo', 'frontend-sync', 'api-changes']
            });

  agent-summary-report:
    needs: [
      detect-backend-changes,
      backend-engineer-tasks,
      blockchain-security-check,
      api-testing-suite,
      database-optimization,
      deployment-preparation
    ]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Generate Final Report
        run: |
          cat > summary-report.md << 'EOF'
          # 🤖 Backend Agent Coordination Summary
          
          ## Execution Status
          
          | Component | Changed | Agent | Status |
          |-----------|---------|-------|--------|
          | API Routes | ${{ needs.detect-backend-changes.outputs.api_changed }} | Backend Engineer | ${{ needs.backend-engineer-tasks.result }} |
          | Blockchain | ${{ needs.detect-backend-changes.outputs.blockchain_changed }} | Security Auditor | ${{ needs.blockchain-security-check.result }} |
          | Database | ${{ needs.detect-backend-changes.outputs.database_changed }} | Backend Engineer | ${{ needs.database-optimization.result }} |
          | Testing | Required | Testing Expert | ${{ needs.api-testing-suite.result }} |
          
          ## Critical Actions
          1. **Immediate**: Security review if blockchain changes detected
          2. **High Priority**: API testing for modified endpoints
          3. **Medium Priority**: Database optimization review
          4. **Scheduled**: Deployment preparation if approved
          
          ## Cross-Repository Impact
          - Frontend notification: ${needs.detect-backend-changes.outputs.api_changed == 'true' ? 'Sent' : 'Not required'}
          - Breaking changes: To be determined by backend engineer
          - Migration guide: Required if database schema changed
          
          ## Next Steps
          1. Agents process assigned tasks
          2. Report findings via issue comments
          3. Cross-repo sync via dispatch events
          4. Final review before deployment
          
          EOF
          
          cat summary-report.md >> $GITHUB_STEP_SUMMARY
          
      - name: Update PR Status
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const summary = `
            ## 🔧 Backend Agent Analysis Complete
            
            **Components Affected:**
            - API: ${needs.detect-backend-changes.outputs.api_changed == 'true' ? '✓ Changed' : '○ No changes'}
            - Blockchain: ${needs.detect-backend-changes.outputs.blockchain_changed == 'true' ? '✓ Changed' : '○ No changes'}
            - Database: ${needs.detect-backend-changes.outputs.database_changed == 'true' ? '✓ Changed' : '○ No changes'}
            - Security: ${needs.detect-backend-changes.outputs.security_impact == 'true' ? '⚠️ Review required' : '✓ Clear'}
            
            **Agent Assignments:**
            All relevant agents have been notified and will report their findings.
            
            ${needs.detect-backend-changes.outputs.api_changed == 'true' ? '**Note**: Frontend team has been notified of API changes.' : ''}
            `;
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: summary
            });