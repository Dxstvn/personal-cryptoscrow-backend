name: Backend Cross-Repository Sync

on:
  repository_dispatch:
    types: [frontend-changes, frontend-deployment-ready, testing-results]
  workflow_dispatch:
    inputs:
      sync_action:
        description: 'Synchronization action'
        required: true
        type: choice
        options:
          - 'notify-frontend-api-changes'
          - 'request-frontend-testing'
          - 'coordinate-deployment'
          - 'share-security-findings'

jobs:
  notify-frontend-changes:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.sync_action == 'notify-frontend-api-changes'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Analyze API Changes
        id: api_analysis
        run: |
          # Extract API changes from recent commits
          CHANGES=$(git log --oneline -n 10 --grep="api" --grep="endpoint" | head -5)
          echo "recent_changes<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          
      - name: Create Frontend Notification
        run: |
          cat > frontend-notification.md << 'EOF'
          # Frontend API Update Notification
          
          ## Recent Backend API Changes
          ${{ steps.api_analysis.outputs.recent_changes }}
          
          ## Integration Points
          1. Authentication endpoints
          2. Transaction management
          3. Wallet operations
          4. File upload/download
          5. Real-time sync
          
          ## Testing Requirements
          - Update API mocks
          - Test error scenarios
          - Verify type safety
          - Check loading states
          EOF
          
          cat frontend-notification.md >> $GITHUB_STEP_SUMMARY
          
      - name: Log Cross-Repo Event
        run: |
          echo "Cross-repository notification sent to frontend"
          echo "Event: API changes notification"
          echo "Timestamp: $(date -u +%Y-%m-%dT%H:%M:%SZ)"

  process-frontend-requests:
    if: github.event_name == 'repository_dispatch' && github.event.action == 'frontend-changes'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Process Frontend Request
        run: |
          echo "## 🎨 Frontend Request Received" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Request Details" >> $GITHUB_STEP_SUMMARY
          echo "- Type: ${{ github.event.client_payload.request_type }}" >> $GITHUB_STEP_SUMMARY
          echo "- Component: ${{ github.event.client_payload.component }}" >> $GITHUB_STEP_SUMMARY
          echo "- Priority: ${{ github.event.client_payload.priority }}" >> $GITHUB_STEP_SUMMARY
          
      - name: Create Backend Task
        uses: actions/github-script@v7
        with:
          script: |
            const requestType = '${{ github.event.client_payload.request_type }}';
            let taskBody = '';
            let labels = ['frontend-request', 'agent-task'];
            
            switch(requestType) {
              case 'new-endpoint':
                taskBody = `
                ## 🔧 New Endpoint Request from Frontend
                
                The frontend team has requested a new API endpoint.
                
                ### Endpoint Details
                - Path: ${{ github.event.client_payload.endpoint_path }}
                - Method: ${{ github.event.client_payload.method }}
                - Purpose: ${{ github.event.client_payload.purpose }}
                
                ### Implementation Checklist
                - [ ] Design endpoint schema
                - [ ] Implement business logic
                - [ ] Add validation middleware
                - [ ] Write unit tests
                - [ ] Write integration tests
                - [ ] Update API documentation
                - [ ] Notify frontend of completion
                
                /cc @cryptoescrow-backend-engineer
                `;
                labels.push('backend', 'api');
                break;
                
              case 'performance-issue':
                taskBody = `
                ## ⚡ Performance Issue Reported
                
                The frontend is experiencing performance issues with backend APIs.
                
                ### Issue Details
                - Endpoint: ${{ github.event.client_payload.endpoint }}
                - Response Time: ${{ github.event.client_payload.response_time }}
                - Expected: < 200ms
                
                ### Investigation Steps
                - [ ] Profile database queries
                - [ ] Check N+1 query issues
                - [ ] Review caching strategy
                - [ ] Optimize indexes
                - [ ] Consider pagination
                
                /cc @cryptoescrow-backend-engineer
                `;
                labels.push('performance', 'priority-high');
                break;
                
              case 'bug-report':
                taskBody = `
                ## 🐛 Bug Report from Frontend
                
                ### Bug Description
                ${{ github.event.client_payload.description }}
                
                ### Reproduction Steps
                ${{ github.event.client_payload.steps }}
                
                ### Expected vs Actual
                - Expected: ${{ github.event.client_payload.expected }}
                - Actual: ${{ github.event.client_payload.actual }}
                
                ### Investigation Checklist
                - [ ] Reproduce the issue
                - [ ] Check error logs
                - [ ] Review recent changes
                - [ ] Identify root cause
                - [ ] Implement fix
                - [ ] Add regression test
                
                /cc @cryptoescrow-backend-engineer @clearhold-testing-expert
                `;
                labels.push('bug', 'priority-high');
                break;
            }
            
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[FRONTEND-REQUEST] ${requestType}`,
              body: taskBody,
              labels: labels
            });

  security-coordination:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.sync_action == 'share-security-findings'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Compile Security Report
        run: |
          echo "## 🔒 Backend Security Report" >> security-report.md
          echo "" >> security-report.md
          echo "### Recent Security Updates" >> security-report.md
          echo "1. Authentication middleware hardened" >> security-report.md
          echo "2. Rate limiting implemented" >> security-report.md
          echo "3. Input validation enhanced" >> security-report.md
          echo "4. Security headers configured" >> security-report.md
          echo "" >> security-report.md
          echo "### Frontend Action Items" >> security-report.md
          echo "- Update authentication flow" >> security-report.md
          echo "- Implement CSRF tokens" >> security-report.md
          echo "- Review XSS prevention" >> security-report.md
          echo "- Update security headers" >> security-report.md
          
          cat security-report.md >> $GITHUB_STEP_SUMMARY

  deployment-coordination:
    if: |
      (github.event_name == 'repository_dispatch' && github.event.action == 'frontend-deployment-ready') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.sync_action == 'coordinate-deployment')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Deployment Coordination Plan
        run: |
          cat > deployment-plan.md << 'EOF'
          # 🚀 Coordinated Deployment Plan
          
          ## Deployment Sequence
          1. **Backend Deployment** (This repo)
             - Database migrations
             - API updates
             - Smart contract updates
             - Cache warming
             
          2. **Frontend Deployment**
             - After backend is stable
             - Feature flags enabled
             - Progressive rollout
             
          ## Compatibility Matrix
          | Backend Version | Compatible Frontend |
          |----------------|-------------------|
          | v2.0.0         | v1.5.0+          |
          | v2.1.0         | v1.6.0+          |
          | v2.2.0 (current) | v1.7.0+        |
          
          ## Rollback Strategy
          - Backend: Previous Docker image
          - Frontend: Previous deployment
          - Database: Point-in-time recovery
          - Smart Contracts: Emergency pause
          
          ## Monitoring
          - API response times
          - Error rates
          - Database performance
          - Blockchain transaction success
          EOF
          
          cat deployment-plan.md >> $GITHUB_STEP_SUMMARY
          
      - name: Create Deployment Issue
        uses: actions/github-script@v7
        with:
          script: |
            const deploymentTask = `
            ## 🚀 Coordinated Deployment Required
            
            ### Pre-Deployment Checklist
            - [ ] All tests passing
            - [ ] Security scan completed
            - [ ] Performance benchmarks met
            - [ ] Database backup created
            - [ ] Rollback plan documented
            
            ### Backend Deployment Steps
            1. [ ] Update AWS Secrets Manager
            2. [ ] Deploy to staging
            3. [ ] Run smoke tests
            4. [ ] Monitor for 30 minutes
            5. [ ] Deploy to production
            6. [ ] Verify all services
            
            ### Frontend Coordination
            - [ ] Notify frontend team of backend readiness
            - [ ] Coordinate deployment window
            - [ ] Test integration post-deployment
            - [ ] Monitor error rates together
            
            ### Success Criteria
            - API response time < 200ms (p95)
            - Error rate < 0.1%
            - All health checks passing
            - No critical alerts for 1 hour
            
            /cc @cryptoescrow-backend-engineer @clearhold-frontend-engineer
            `;
            
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '[DEPLOYMENT] Backend-Frontend coordination',
              body: deploymentTask,
              labels: ['deployment', 'coordination', 'agent-task']
            });

  testing-results-sync:
    if: github.event_name == 'repository_dispatch' && github.event.action == 'testing-results'
    runs-on: ubuntu-latest
    steps:
      - name: Process Test Results
        run: |
          echo "## 🧪 Frontend Test Results Received" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Test Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Total Tests: ${{ github.event.client_payload.total_tests }}" >> $GITHUB_STEP_SUMMARY
          echo "- Passed: ${{ github.event.client_payload.passed }}" >> $GITHUB_STEP_SUMMARY
          echo "- Failed: ${{ github.event.client_payload.failed }}" >> $GITHUB_STEP_SUMMARY
          echo "- Coverage: ${{ github.event.client_payload.coverage }}%" >> $GITHUB_STEP_SUMMARY
          
      - name: Analyze Integration Test Failures
        if: github.event.client_payload.integration_failures > 0
        uses: actions/github-script@v7
        with:
          script: |
            const testAnalysis = `
            ## 🧪 Integration Test Failures Detected
            
            Frontend integration tests are failing against backend APIs.
            
            ### Failure Summary
            - Failed Tests: ${{ github.event.client_payload.integration_failures }}
            - Affected Endpoints: ${{ github.event.client_payload.affected_endpoints }}
            
            ### Common Issues
            1. **Authentication**: Token format or expiry
            2. **Validation**: Request schema mismatch
            3. **Response Format**: Unexpected response structure
            4. **Error Codes**: Different error code returned
            
            ### Investigation Required
            - [ ] Review failing test logs
            - [ ] Check recent API changes
            - [ ] Verify request/response contracts
            - [ ] Test manually with Postman
            - [ ] Update API documentation
            
            /cc @cryptoescrow-backend-engineer @clearhold-testing-expert
            `;
            
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '[TESTING] Frontend integration test failures',
              body: testAnalysis,
              labels: ['testing', 'integration', 'agent-task']
            });

  sync-summary:
    needs: [
      notify-frontend-changes,
      process-frontend-requests,
      security-coordination,
      deployment-coordination,
      testing-results-sync
    ]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Generate Summary Report
        run: |
          echo "# 🔄 Backend Cross-Repository Sync Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Sync Activities" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          echo "| Activity | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend Notifications | ${{ needs.notify-frontend-changes.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend Requests | ${{ needs.process-frontend-requests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Security Coordination | ${{ needs.security-coordination.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Deployment Coordination | ${{ needs.deployment-coordination.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Test Results Sync | ${{ needs.testing-results-sync.result }} |" >> $GITHUB_STEP_SUMMARY
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Inter-Repository Communication" >> $GITHUB_STEP_SUMMARY
          echo "- All cross-repository tasks have been logged" >> $GITHUB_STEP_SUMMARY
          echo "- Agents have been notified via issues" >> $GITHUB_STEP_SUMMARY
          echo "- Follow-up actions will be tracked" >> $GITHUB_STEP_SUMMARY