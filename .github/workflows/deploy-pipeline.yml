name: Deploy Pipeline

on:
  # Manual deployment only - no automatic deployments
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        type: choice
        options:
          - 'staging'
          - 'production'
      run_full_tests:
        description: 'Run full test suite before deploy'
        required: false
        type: boolean
        default: true
      deployment_notes:
        description: 'Deployment notes or JIRA ticket'
        required: true
        type: string

env:
  NODE_VERSION: '18.x'
  AWS_REGION: 'us-east-1'

jobs:
  # Pre-deployment validation
  pre-deployment-checks:
    name: Pre-deployment Validation
    runs-on: ubuntu-latest
    outputs:
      can_deploy: ${{ steps.validation.outputs.can_deploy }}
      warnings: ${{ steps.validation.outputs.warnings }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit
        
      - name: Run deployment validation
        id: validation
        run: |
          echo "can_deploy=true" >> $GITHUB_OUTPUT
          WARNINGS=""
          
          # Check if on correct branch
          if [[ "${{ github.event.inputs.environment }}" == "production" ]]; then
            if [[ "${{ github.ref }}" != "refs/heads/main" ]]; then
              echo "::error::Production deployments must be from main branch"
              echo "can_deploy=false" >> $GITHUB_OUTPUT
            fi
          fi
          
          # Check for uncommitted changes
          if [[ -n $(git status --porcelain) ]]; then
            WARNINGS="${WARNINGS}Uncommitted changes detected. "
          fi
          
          # Check if tests are being skipped
          if [[ "${{ github.event.inputs.skip_tests }}" == "true" ]]; then
            WARNINGS="${WARNINGS}Tests are being skipped! "
          fi
          
          # Check last deployment time (prevent too frequent deployments)
          # This would check deployment tags in a real scenario
          
          echo "warnings=$WARNINGS" >> $GITHUB_OUTPUT
          
      - name: Generate pre-deployment report
        run: |
          echo "# Pre-deployment Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** ${{ github.event.inputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**Triggered by:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "**Notes:** ${{ github.event.inputs.deployment_notes }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [[ -n "${{ steps.validation.outputs.warnings }}" ]]; then
            echo "## ⚠️ Warnings" >> $GITHUB_STEP_SUMMARY
            echo "${{ steps.validation.outputs.warnings }}" >> $GITHUB_STEP_SUMMARY
          fi

  # Run only unit tests by default, full suite optional
  test-suite:
    name: Pre-deployment Tests
    needs: pre-deployment-checks
    if: needs.pre-deployment-checks.outputs.can_deploy == 'true'
    uses: ./.github/workflows/ci-test-pipeline.yml
    with:
      test_scope: ${{ github.event.inputs.run_full_tests == 'true' && 'all' || 'unit' }}

  # Build and prepare deployment artifacts
  build:
    name: Build Application
    runs-on: ubuntu-latest
    needs: [pre-deployment-checks, test-suite]
    if: |
      always() &&
      needs.pre-deployment-checks.outputs.can_deploy == 'true' &&
      (needs.test-suite.result == 'success' || github.event.inputs.skip_tests == 'true')
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          
      - name: Install dependencies
        run: |
          # Install with exact versions from lockfile
          npm ci --prefer-offline --no-audit
          
          # Prune dev dependencies for smaller package
          npm prune --production
        
      - name: Run build and validation
        run: |
          # Build any necessary assets
          if [ -f "build.js" ]; then
            node build.js
          fi
          
          # Validate configuration
          node -e "console.log('Config validation would run here')"
          
          # Check for required environment variables
          if [[ "${{ github.event.inputs.environment }}" == "production" ]]; then
            echo "Validating production configuration..."
            # Would check for required env vars
          fi
          
      - name: Create deployment package
        run: |
          # Create optimized deployment package
          echo "Creating deployment package..."
          
          # Create deployment directory
          mkdir -p deploy-package
          
          # Copy only necessary files
          cp -r src deploy-package/
          cp package*.json deploy-package/
          cp -r scripts deploy-package/ 2>/dev/null || true
          cp .env.example deploy-package/ 2>/dev/null || true
          
          # Create deployment info file
          cat > deploy-package/deployment-info.json << EOF
          {
            "version": "${{ github.sha }}",
            "environment": "${{ github.event.inputs.environment }}",
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "deployer": "${{ github.actor }}",
            "notes": "${{ github.event.inputs.deployment_notes }}"
          }
          EOF
          
          # Create tarball
          tar -czf deploy-package.tar.gz deploy-package/
            
      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: deployment-package-${{ github.event.inputs.environment }}
          path: deploy-package.tar.gz
          retention-days: 7

  # Manual approval gate for production
  approval:
    name: Deployment Approval
    runs-on: ubuntu-latest
    needs: build
    if: github.event.inputs.environment == 'production'
    environment: production-approval
    steps:
      - name: Request approval
        run: |
          echo "# 🚨 Production Deployment Approval Required" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Requester:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** Production" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Please review the deployment details and approve if ready." >> $GITHUB_STEP_SUMMARY

  # Deploy to AWS EC2
  deploy:
    name: Deploy to ${{ github.event.inputs.environment }}
    runs-on: ubuntu-latest
    needs: [build, approval]
    if: |
      always() &&
      needs.build.result == 'success' &&
      (needs.approval.result == 'success' || github.event.inputs.environment != 'production')
    environment: ${{ github.event.inputs.environment }}
    steps:
      - uses: actions/checkout@v4
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
          
      - name: Download deployment artifact
        uses: actions/download-artifact@v4
        with:
          name: deployment-package-${{ github.event.inputs.environment }}
          
      - name: Deploy to EC2
        env:
          ENVIRONMENT: ${{ github.event.inputs.environment }}
          EC2_HOST: ${{ secrets[format('{0}_EC2_HOST', github.event.inputs.environment)] }}
          DEPLOY_KEY: ${{ secrets[format('{0}_DEPLOY_KEY', github.event.inputs.environment)] }}
        run: |
          echo "Starting deployment to $ENVIRONMENT..."
          
          # Upload to S3 deployment bucket
          DEPLOYMENT_ID="deploy-${GITHUB_SHA:0:8}-$(date +%s)"
          aws s3 cp deploy-package.tar.gz "s3://clearhold-deployments/$ENVIRONMENT/$DEPLOYMENT_ID.tar.gz"
          
          # Trigger deployment via SSM
          aws ssm send-command \
            --instance-ids "${{ secrets[format('{0}_INSTANCE_ID', github.event.inputs.environment)] }}" \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=[\"bash /opt/clearhold/scripts/deploy.sh $DEPLOYMENT_ID $ENVIRONMENT\"]" \
            --output json > deployment-command.json
          
          # Wait for deployment to complete
          COMMAND_ID=$(jq -r '.Command.CommandId' deployment-command.json)
          echo "Deployment command ID: $COMMAND_ID"
          
          # Poll for completion (with timeout)
          for i in {1..30}; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "${{ secrets[format('{0}_INSTANCE_ID', github.event.inputs.environment)] }}" \
              --query 'Status' --output text 2>/dev/null || echo "InProgress")
            
            if [[ "$STATUS" == "Success" ]]; then
              echo "Deployment completed successfully!"
              break
            elif [[ "$STATUS" == "Failed" ]]; then
              echo "Deployment failed!"
              exit 1
            fi
            
            echo "Deployment status: $STATUS (attempt $i/30)"
            sleep 10
          done
          
      - name: Run smoke tests
        env:
          API_URL: ${{ github.event.inputs.environment == 'production' && 'https://api.clearhold.com' || 'https://staging-api.clearhold.com' }}
        run: |
          echo "Running smoke tests against $API_URL..."
          
          # Health check
          echo "Checking health endpoint..."
          curl -f -s "$API_URL/health" || exit 1
          
          # API version check
          echo "Checking API version..."
          VERSION=$(curl -s "$API_URL/version" | jq -r '.version')
          echo "Deployed version: $VERSION"
          
          # Critical endpoints check
          ENDPOINTS=("/api/auth/verify" "/api/wallet/networks" "/api/transaction/status")
          for endpoint in "${ENDPOINTS[@]}"; do
            echo "Testing $endpoint..."
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$API_URL$endpoint")
            if [[ "$STATUS" != "200" && "$STATUS" != "401" ]]; then
              echo "Warning: $endpoint returned $STATUS"
            fi
          done
          
          echo "Smoke tests completed!"

  # Post-deployment verification and monitoring setup
  post-deployment:
    name: Post-deployment Verification
    runs-on: ubuntu-latest
    needs: deploy
    if: always() && needs.deploy.result == 'success'
    steps:
      - name: Setup monitoring alerts
        run: |
          echo "# 📊 Post-deployment Status" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** ${{ github.event.inputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "**Deployment:** Successful ✅" >> $GITHUB_STEP_SUMMARY
          echo "**Time:** $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 🔍 Monitor These Metrics (Next 30 mins)" >> $GITHUB_STEP_SUMMARY
          echo "1. **Response Times**: Should remain under 500ms p95" >> $GITHUB_STEP_SUMMARY
          echo "2. **Error Rate**: Should stay below 0.1%" >> $GITHUB_STEP_SUMMARY
          echo "3. **Memory Usage**: Should stabilize within 10 mins" >> $GITHUB_STEP_SUMMARY
          echo "4. **CPU Usage**: Spikes normal during startup" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 📡 Quick Links" >> $GITHUB_STEP_SUMMARY
          if [[ "${{ github.event.inputs.environment }}" == "production" ]]; then
            echo "- [CloudWatch Dashboard](https://console.aws.amazon.com/cloudwatch/production)" >> $GITHUB_STEP_SUMMARY
            echo "- [API Health](https://api.clearhold.com/health)" >> $GITHUB_STEP_SUMMARY
          else
            echo "- [CloudWatch Dashboard](https://console.aws.amazon.com/cloudwatch/staging)" >> $GITHUB_STEP_SUMMARY
            echo "- [API Health](https://staging-api.clearhold.com/health)" >> $GITHUB_STEP_SUMMARY
          fi
          
      - name: Create deployment record
        uses: actions/github-script@v7
        with:
          script: |
            // Create a deployment record
            const deployment = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.sha,
              environment: '${{ github.event.inputs.environment }}',
              description: '${{ github.event.inputs.deployment_notes }}',
              auto_merge: false,
              required_contexts: []
            });
            
            // Mark deployment as successful
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: deployment.data.id,
              state: 'success',
              environment_url: `https://${{ github.event.inputs.environment }}.clearhold.com`,
              description: 'Deployment completed successfully'
            });

  # Rollback workflow (can be triggered if issues detected)
  rollback-preparation:
    name: Prepare Rollback
    runs-on: ubuntu-latest
    needs: deploy
    if: failure()
    steps:
      - name: Generate rollback instructions
        run: |
          echo "# 🔄 Rollback Instructions" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Deployment Failed!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Quick Rollback Steps:" >> $GITHUB_STEP_SUMMARY
          echo "1. SSH to EC2 instance" >> $GITHUB_STEP_SUMMARY
          echo "2. Run: \`./scripts/rollback.sh\`" >> $GITHUB_STEP_SUMMARY
          echo "3. Verify service is running previous version" >> $GITHUB_STEP_SUMMARY
          echo "4. Check health endpoints" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Manual Rollback:" >> $GITHUB_STEP_SUMMARY
          echo "1. Stop current service: \`pm2 stop clearhold-backend\`" >> $GITHUB_STEP_SUMMARY
          echo "2. Restore previous version: \`cp -r /opt/clearhold/backup/* /opt/clearhold/current/\`" >> $GITHUB_STEP_SUMMARY
          echo "3. Start service: \`pm2 start clearhold-backend\`" >> $GITHUB_STEP_SUMMARY
          
      - name: Send rollback alert
        if: github.event.inputs.environment == 'production'
        run: |
          echo "::error::Production deployment failed! Rollback may be required."
          # In real scenario, send alerts via Slack/PagerDuty

  # Final summary
  deployment-summary:
    name: Deployment Summary
    runs-on: ubuntu-latest
    needs: [deploy, post-deployment, rollback-preparation]
    if: always()
    steps:
      - name: Generate final summary
        run: |
          echo "# 🚀 Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Deployment Details" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment:** ${{ github.event.inputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Triggered by:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Time:** $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [[ "${{ needs.deploy.result }}" == "success" ]]; then
            echo "✅ **Deployment successful!**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Next Steps:" >> $GITHUB_STEP_SUMMARY
            echo "1. Monitor application metrics for 30 minutes" >> $GITHUB_STEP_SUMMARY
            echo "2. Check error rates and response times" >> $GITHUB_STEP_SUMMARY
            echo "3. Verify all critical features are working" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Deployment failed!**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Required Actions:" >> $GITHUB_STEP_SUMMARY
            echo "1. Review error logs" >> $GITHUB_STEP_SUMMARY
            echo "2. Execute rollback if necessary" >> $GITHUB_STEP_SUMMARY
            echo "3. Investigate root cause" >> $GITHUB_STEP_SUMMARY
          fi